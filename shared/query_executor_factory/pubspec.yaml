name: query_executor_factory
description: Builds a Drift QueryExecutor for the current platform.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ^3.35.0

dependencies:
  # Floored at 2.34 for `sqlite3` 3.x, and that floor is load-bearing rather
  # than housekeeping. 3.x bundles a prebuilt SQLite through Dart build hooks;
  # 2.x got it from the `sqlite3_flutter_libs` plugin, which is end-of-life and
  # no longer in this repo. Drop back below 2.34 and `NativeDatabase` loses its
  # native library on Android and Windows, with nothing in analyze or test to
  # say so. This package picks the platform executor, so it owns the floor.
  drift: ^2.34.0
  flutter:
    sdk: flutter
  path:
  path_provider:

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0
