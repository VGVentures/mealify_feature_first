version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  clock:
  drift:
  drift_flutter:
  drinks_domain:
    path: ../drinks_domain
  flutter:
    sdk: flutter
  http:
  http_status:
