name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (FVM)
        uses: kuhnroyal/flutter-fvm-config-action/setup@v3
        with:
          post-setup-script: fvm install && fvm use --force

      - name: Install Dependencies
        run: fvm flutter pub get

      - name: Check Formatting
        run: make check_formatting

      - name: Analyze
        run: make analyze

      - name: Run tests
        run: make test