name: Monorepo Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "features/**"
      - "shared/**"
      # The Melos scripts live here, so a change to them has to trigger a run.
      - "pubspec.yaml"
      - ".github/workflows/monorepo_build.yaml"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.read_fvm.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read_fvm
        name: Extract Version from .fvmrc
        run: |
          VERSION=$(jq -r .flutter .fvmrc)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  check_licenses:
    name: Check Licenses
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      - run: flutter pub get --no-example
      # Pinned to a published version rather than a git branch: a floating ref
      # moves under us, which is how this step broke. 1.2.0 is the newest release
      # that supports the Dart SDK pinned in .fvmrc; 1.3.0 requires Dart 3.12,
      # so raise this only alongside the Flutter version.
      - name: Install very_good_cli
        run: dart pub global activate very_good_cli 1.2.0
      - name: Check licenses
        run: dart pub global run very_good_cli:very_good packages check licenses --dependency-type=direct-main,transitive --allowed=MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,ISC,Zlib

  verify_and_test:
    name: Verify and Test
    needs: setup
    runs-on: ubuntu-latest
    env:
      # Melos config sets `sdkPath: .fvm/flutter_sdk` for local runs, but `.fvm/`
      # is gitignored and never exists on a runner. `auto` points Melos at the SDK
      # flutter-action installs instead.
      MELOS_SDK_PATH: auto
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      # Resolves the whole workspace, which is also what installs Melos.
      - name: Install dependencies
        run: flutter pub get --no-example
      # Generated code is committed, so regenerating it has to be a no-op. When
      # it is not, a source changed without its output being refreshed, and the
      # stale copy would otherwise pass review looking correct. `--intent-to-add`
      # makes `git diff` see brand-new generated files, not only changed ones.
      - name: Check generated files are up to date
        run: |
          dart run melos generate
          git add --intent-to-add .
          git diff --exit-code
      # Melos derives the package list from the `workspace` key in the root
      # pubspec, so a new package is covered here without touching this file.
      - name: Check formatting
        run: dart run melos format --set-exit-if-changed
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test

  # `package:sqlite3` 3.x bundles its native library through Dart build hooks
  # rather than the old `sqlite3_flutter_libs` plugin. Android and Windows are
  # the platforms that actually need that binary, and neither is buildable from
  # a mac, so nothing a developer runs locally can tell you it arrived. This job
  # is the only thing standing between a dependency bump and a release that
  # crashes the first time it opens a database.
  #
  # It asserts on the produced artifact, never on the exit status: `flutter
  # build` has been observed exiting 0 while refusing to build (wrong target,
  # missing flavor configuration), so a green step proves nothing on its own.
  native_sqlite:
    name: Native SQLite (${{ matrix.platform }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-latest
            # Android has product flavors; Windows does not support them at all,
            # so the build arguments cannot be shared between the two.
            #
            # `--debug` is required, not a shortcut. A release build resolves the
            # `release` signingConfig, which reads a keystore from
            # ANDROID_KEYSTORE_PATH or a gitignored `key.properties`. CI has
            # neither, so a release build dies at signing before this job's
            # assertion ever runs, and the check silently stops checking SQLite.
            # Debug signs with the auto-generated debug key, and bundles the same
            # native libraries.
            build: apk --debug --flavor development -t lib/main_development.dart
          - platform: windows
            runs-on: windows-latest
            # Windows needs no signing, but debug keeps it symmetrical and quick.
            build: windows --debug -t lib/main_development.dart
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      - name: Install dependencies
        run: flutter pub get --no-example
      - name: Build ${{ matrix.platform }}
        working-directory: apps/mealify_app
        run: flutter build ${{ matrix.build }}
      # The build above is not the check. This is. It looks inside the artifact
      # that actually ships rather than at an intermediate build directory,
      # because an intermediate path is a guess about the toolchain's internals
      # and would start passing or failing for reasons unrelated to SQLite.
      - name: Assert the SQLite binary was bundled
        shell: bash
        working-directory: apps/mealify_app
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            android)
              apk=$(find build -name "*.apk" -print -quit)
              [ -n "$apk" ] || { echo "::error::No APK was produced."; exit 1; }
              echo "Inspecting $apk"
              # Native libraries live under lib/<abi>/ inside the APK.
              found=$(unzip -Z1 "$apk" 'lib/*' | grep -i sqlite3 || true)
              ;;
            windows)
              echo "Inspecting the runner output directory"
              found=$(find build/windows -iname "*sqlite3*.dll" || true)
              ;;
          esac
          if [ -z "$found" ]; then
            echo "::error::No SQLite native library in the ${{ matrix.platform }} artifact."
            echo "The build hook in package:sqlite3 did not deliver it, so the app"
            echo "would throw the first time it opens a database on this platform."
            echo "--- what the artifact does contain ---"
            case "${{ matrix.platform }}" in
              android) unzip -Z1 "$apk" 'lib/*' || true ;;
              windows) find build/windows -iname "*.dll" || true ;;
            esac
            exit 1
          fi
          echo "Found:"
          echo "$found"
