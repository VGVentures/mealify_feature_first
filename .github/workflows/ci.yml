name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FVM CLI
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Cache FVM SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm/versions
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}

      - name: Setup Flutter via FVM
        run: fvm install

      - name: Create Project Symlink
        run: fvm use --force

      - name: Install Dependencies
        run: fvm flutter pub get

      - name: Check Formatting
        run: make check_formatting

      - name: Analyze
        run: make analyze

      - name: Run tests
        run: make test