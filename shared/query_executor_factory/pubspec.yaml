name: query_executor_factory
description: Builds a Drift QueryExecutor for the current platform.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  drift:
  flutter:
    sdk: flutter
  path:
  path_provider:
  # Ships the native SQLite binary that `NativeDatabase` opens on Android and
  # Windows. It used to arrive transitively through `drift_flutter` in the data
  # packages; those are pure Dart now, so the package that picks the platform
  # executor owns the platform's native library too.
  #
  # Pinned to 0.5.x on purpose. 0.6.0 is an end-of-life stub that registers no
  # plugin and ships no library; it is only correct once `package:sqlite3`
  # reaches 3.x, and drift still resolves that to 2.x. Leaving this unbounded
  # silently drops the native library from the Android and Windows builds.
  sqlite3_flutter_libs: ^0.5.41

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0
