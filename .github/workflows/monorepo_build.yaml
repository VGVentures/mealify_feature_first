name: Monorepo Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "features/**"
      - "shared/**"
      # The Melos scripts live here, so a change to them has to trigger a run.
      - "pubspec.yaml"
      - ".github/workflows/monorepo_build.yaml"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.read_fvm.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read_fvm
        name: Extract Version from .fvmrc
        run: |
          VERSION=$(jq -r .flutter .fvmrc)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  check_licenses:
    name: Check Licenses
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      - run: flutter pub get --no-example
      # Pinned to a published version rather than a git branch: a floating ref
      # moves under us, which is how this step broke. 1.2.0 is the newest release
      # that supports the Dart SDK pinned in .fvmrc; 1.3.0 requires Dart 3.12,
      # so raise this only alongside the Flutter version.
      - name: Install very_good_cli
        run: dart pub global activate very_good_cli 1.2.0
      - name: Check licenses
        run: dart pub global run very_good_cli:very_good packages check licenses --dependency-type=direct-main,transitive --allowed=MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,ISC,Zlib

  verify_and_test:
    name: Verify and Test
    needs: setup
    runs-on: ubuntu-latest
    env:
      # Melos config sets `sdkPath: .fvm/flutter_sdk` for local runs, but `.fvm/`
      # is gitignored and never exists on a runner. `auto` points Melos at the SDK
      # flutter-action installs instead.
      MELOS_SDK_PATH: auto
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      # Resolves the whole workspace, which is also what installs Melos.
      - name: Install dependencies
        run: flutter pub get --no-example
      # Generated code is committed, so regenerating it has to be a no-op. When
      # it is not, a source changed without its output being refreshed, and the
      # stale copy would otherwise pass review looking correct. `--intent-to-add`
      # makes `git diff` see brand-new generated files, not only changed ones.
      - name: Check generated files are up to date
        run: |
          dart run melos generate
          git add --intent-to-add .
          git diff --exit-code
      # Melos derives the package list from the `workspace` key in the root
      # pubspec, so a new package is covered here without touching this file.
      - name: Check formatting
        run: dart run melos format --set-exit-if-changed
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test

  # `package:sqlite3` 3.x bundles its native library through Dart build hooks
  # rather than the old `sqlite3_flutter_libs` plugin. Android and Windows are
  # the platforms that actually need that binary, and neither is buildable from
  # a mac, so nothing a developer runs locally can tell you it arrived. This job
  # is the only thing standing between a dependency bump and a release that
  # crashes the first time it opens a database.
  #
  # It asserts on the produced artifact, never on the exit status: `flutter
  # build` has been observed exiting 0 while refusing to build (wrong target,
  # missing flavor configuration), so a green step proves nothing on its own.
  native_sqlite:
    name: Native SQLite (${{ matrix.platform }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-latest
            # Android has product flavors; Windows does not support them at all,
            # so the build arguments cannot be shared between the two.
            build: apk --flavor development -t lib/main_development.dart
            # `.so` for every ABI the app ships.
            library_glob: "**/lib/*/libsqlite3.so"
          - platform: windows
            runs-on: windows-latest
            build: windows -t lib/main_development.dart
            library_glob: "**/sqlite3.dll"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      - name: Install dependencies
        run: flutter pub get --no-example
      - name: Build ${{ matrix.platform }}
        working-directory: apps/mealify_app
        run: flutter build ${{ matrix.build }}
      # The build above is not the check. This is.
      - name: Assert the SQLite binary was bundled
        shell: bash
        working-directory: apps/mealify_app
        run: |
          found=$(find build -path "${{ matrix.library_glob }}" -print -quit)
          if [ -z "$found" ]; then
            echo "::error::No SQLite native library in the ${{ matrix.platform }} build output."
            echo "Expected something matching ${{ matrix.library_glob }} under apps/mealify_app/build."
            echo "The hook in package:sqlite3 did not deliver it, so the app would"
            echo "crash the first time it opens a database on this platform."
            exit 1
          fi
          echo "Found $found"
