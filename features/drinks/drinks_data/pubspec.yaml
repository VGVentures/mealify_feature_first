version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  drift:
  drinks_domain:
    path: ../drinks_domain
  http:
  http_status:
  json_annotation:
  meta:

dev_dependencies:
  build_runner:
  drift_dev: ^2.16.0
  http_client_factory:
    path: ../../../shared/http_client_factory
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0
