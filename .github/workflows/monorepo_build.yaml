name: Monorepo Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "apps/**"
      - "features/**"
      - "shared/**"
      # The Melos scripts live here, so a change to them has to trigger a run.
      - "pubspec.yaml"
      - ".github/workflows/monorepo_build.yaml"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.read_fvm.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read_fvm
        name: Extract Version from .fvmrc
        run: |
          VERSION=$(jq -r .flutter .fvmrc)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  check_licenses:
    name: Check Licenses
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      - run: flutter pub get --no-example
      # Pinned to a published version rather than a git branch: a floating ref
      # moves under us, which is how this step broke. 1.2.0 is the newest release
      # that supports the Dart SDK pinned in .fvmrc; 1.3.0 requires Dart 3.12,
      # so raise this only alongside the Flutter version.
      - name: Install very_good_cli
        run: dart pub global activate very_good_cli 1.2.0
      - name: Check licenses
        run: dart pub global run very_good_cli:very_good packages check licenses --dependency-type=direct-main,transitive --allowed=MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,ISC,Zlib

  verify_and_test:
    name: Verify and Test
    needs: setup
    runs-on: ubuntu-latest
    env:
      # Melos config sets `sdkPath: .fvm/flutter_sdk` for local runs, but `.fvm/`
      # is gitignored and never exists on a runner. `auto` points Melos at the SDK
      # flutter-action installs instead.
      MELOS_SDK_PATH: auto
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
      # Resolves the whole workspace, which is also what installs Melos.
      - name: Install dependencies
        run: flutter pub get --no-example
      # Melos derives the package list from the `workspace` key in the root
      # pubspec, so a new package is covered here without touching this file.
      - name: Check formatting
        run: dart run melos format --set-exit-if-changed
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test
